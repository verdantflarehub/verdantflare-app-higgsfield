[project]
name = "verdantflare-video-higgsfield-gateway"
version = "0.5.11"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "pydantic==2.12.5", "starlette==0.48.0", "uvicorn==0.40.0", "Pillow==11.3.0", "PyYAML==6.0.2"]

[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["higgsfield_gateway*"]
